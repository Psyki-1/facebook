<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width>, initial-scale=1.0">
    <title>Facebook</title>
    <link rel="stylesheet" href="facebook.css">
</head>
<body>
<main>
    <div class="left-side">
        <img class="facebook-logo" src="images/facebook.png" alt="facebook logo" width =92px>
        <p class="left-p">
            Explore<br>
            the<br>
            things<br>
            <span>you love</span>
        </p>
    </div>
      
    <hr class="login-card-hr">
    <div class="right-side">
        <form>
            <h2 class="header .login-card ">Log into Facebook</h2>
            <input
                id="email"
                name="email"
                type="text"
                placeholder="Email or mobile number"
            >

            <input
                id="password"
                name="password"
                type="password"
                placeholder="Password"
            >

            <button class="login" type="submit">Log in</button>

            <a href="#">Forgot password?</a>

            <button class="create-account" type="button">Create new account</button>
        </form>
    </div>
</main>
   
</body>
</html>
